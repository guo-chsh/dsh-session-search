# Composition layer of `dsh-session-search`.
#
# 1. `session-query-sqlite` ships as `path: ':memory:'`, `openAt: never`, which
#    leaves ranked full-text search off in the base composition. This layer
#    turns it on lazily (`first-search`): the SQLite module and the in-memory
#    index are only created by the first actual search, so a profile that never
#    searches pays nothing. Only the `sessionQuery` search methods need this;
#    exact reads, titles, and filters work with `openAt: never`.
# 2. The plugin row itself: Host route + system prompt, plus the bundled Client
#    half discovered from this package's `dsh.client` declaration.
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: first-search

- insert:
    - id: session-search
      name: 'dsh-session-search'