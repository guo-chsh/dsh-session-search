name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, metadata and contract (Windows, Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The package has no build step and no runtime dependencies: the Client half is a
      # plain script the Host serves as a client module, so parsing it is the real test.
      - name: Host entry parses
        run: node --check index.js

      - name: Client module parses
        run: node --check client.js

      - name: package.json, locale and patch files are valid
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('package.json', 'locale/en.json', 'locale/zh.json')) {
            Get-Content $file -Raw | ConvertFrom-Json | Out-Null
            "ok: $file"
          }

      - name: package.json keeps the runtime contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.dsh.bundle.patch -ne './cordis.patch.yml') { throw 'dsh.bundle.patch must point at cordis.patch.yml' }
          if ($pkg.dsh.client.platform -ne 'web') { throw 'dsh.client.platform must be web' }
          if (-not $pkg.files) { throw 'files must list the shipped halves' }
          foreach ($needed in @('client.js', 'index.js', 'cordis.patch.yml', 'icon.svg')) {
            if ($pkg.files -notcontains $needed) { throw "files must ship $needed" }
          }
          "ok: bundle + client manifest"

      - name: Client declares the slots its panel needs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content client.js -Raw
          foreach ($slot in @("'sidebar.panellist'", "'main'")) {
            if ($source -notmatch [regex]::Escape("name: $slot")) { throw "client.js must register $slot" }
          }
          if ($source -notmatch "inject: \['slots', 'locale', 'sessions', 'workspaces', 'uiWorkspace'\]") {
            throw 'client.js must declare the slots/locale/sessions/workspaces/uiWorkspace injection'
          }
          "ok: slot registration contract"

      - name: Patch layer enables lazy full-text search and inserts the row
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch "id: session-query-sqlite") { throw 'the patch must target the session-query-sqlite row' }
          if ($patch -notmatch "openAt: first-search") { throw 'full-text search must be opened lazily at first search' }
          if ($patch -notmatch "name: 'dsh-plugin-session-search'") { throw 'the patch must insert the plugin row' }
          "ok: composition patch"

      - name: Locale metadata is present in both languages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('locale/en.json', 'locale/zh.json')) {
            $entry = Get-Content $file -Raw | ConvertFrom-Json
            if (-not $entry.meta.title) { throw "$file needs meta.title" }
            if (-not $entry.meta.description) { throw "$file needs meta.description" }
            "ok: $file"
          }
